name: Deploy static preview to GitHub Pages

# Builds a static snapshot of the Django site and publishes it to GitHub Pages.
# Pages only serves static files, so `manage.py export_static` renders every
# public route through the real views (each theme x language), rewrites links
# for the /<repo>/ prefix, and copies the assets. Booking/enquiry POSTs and the
# admin need a real server and are not part of this preview.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test website

      - name: Seed demo content
        run: python manage.py seed_website

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Export static site
        run: |
          python manage.py export_static \
            --out dist \
            --base-path "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
