{% extends 'realstateapp/dashboard/dash_base.html' %}
{% block title %} {% endblock %}
{% load static %}
{% block content %}


    <div class="content-wrapper">
        <div class="container-full">
            <!-- Main content -->
            <section class="content">
                <div class="row">
                    <div class="col-md-12">
                        <div class="box">
                            {% if messages %}
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                {% for message in messages %}
                                <p {% if message.tags %} class="{{ message.tags }}"{% endif %}> 
                                <p class="text-center"><strong>Success!</strong> {{ message }}</p> 
                                </p>
                                {% endfor %}
                            </div>
                            {% endif %}
                            <div class="box-body">
                                <div class="row">
                                    <div class="col-12">
                                        <h4> Update land project </h4>
                                    </div>
    
                                </div>
                                <form action="" method="POST" enctype="multipart/form-data"> {% csrf_token %}
                                    <div class="row">
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="block"
                                                    class="form-label">Block</label>
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    placeholder="Block"
                                                    id="block"
                                                    name="block" value="{{get_land.block}}">
                                            </div>
                                        </div>

                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="sector"
                                                    class="form-label">Sector</label>
                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    id="sector"
                                                    name="sector" value="{{get_land.sector}}">
                                            </div>
                                        </div>
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="road-no"
                                                    class="form-label">Road
                                                    NO</label>
                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    id="road-no"
                                                    name="road_no" value="{{get_land.road_no}}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="plot-no"
                                                    class="form-label">Plot
                                                    NO</label>
                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    id="plot-no"
                                                    name="plot_no" value="{{get_land.plot_no}}">
                                            </div>
                                        </div>
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="land-size"
                                                    class="form-label">Land
                                                    Size</label>
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="land-size"
                                                    name="land_size" value="{{get_land.land_size}}">
                                            </div>
                                        </div>
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="size-unit"
                                                    class="form-label">Size
                                                    Unit</label>
                                                <select
                                                    name="size_unit"
                                                    id="size-unit"
                                                    class="form-control">
                                                    <option
                                                        value="{{get_land.size_unit}}">{{get_land.size_unit}}
                                                        </option>
                                                    <option
                                                        value="sft">SFT</option>
                                                    <option
                                                        value="decimal">Decimal</option>
                                                    <option
                                                        value="katha">Kathe</option>
                                                    <option
                                                        value="bigha">Bigha</option>
                                                    <option
                                                        value="acors">Acors</option>
                                                    <option
                                                        value="sq_metre">Square
                                                        Metre</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-xl-6
                                            col-md-8 col-sm-12
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label for="address"> Developer Name </label>
                                                <input type="text" name="developer_name" value="{{get_land.developer_name}}" class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-xl-6
                                            col-md-8 col-sm-12
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label for="address"> Address </label>
                                                <textarea name="address" id="address" cols="1" rows="2" class="form-control">{{get_land.address}}</textarea>
                                            </div>
                                        </div>

                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-8 col-sm-12
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="map_url"
                                                    class="form-label">Location
                                                    Map url </label>
                                                
                                                    <textarea name="map_url" id="map_url" cols="30" rows="2" class="form-control">{{get_land.map_url}}</textarea>
                                              
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-8 col-sm-12
                                            col-12">
                                            <div
                                                class="form-group">
                                                <table class="table table-bordered" style="margin-bottom:0px;">
                                                    <tr>
                                                        <td>
                                                            <label> land Image </label>
                                                            <input type="file" onchange="showshow(this)" name="plot_land_image"  id="plot_land_image">
                                                        </td>
                                                        <td>
                                                            <div class="std_images"> <img src="/static/realstateapp/media/{{get_land.plot_land_image}}" alt="" id="stImgg" style="width:200px;height: 50px;"> </div> 
                                                        </td>
                                                    </tr>
                                                </table>
                                                
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-12
                                            col-sm-6 col-md-4
                                            mt-3">
                                            <button
                                                type="submit"
                                                class="btn
                                                btn-primary">
                                                <i
                                                    class="ti-save-alt"></i>
                                                Save
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- /.content -->
        </div>
    </div>
    
    <script>
        function show(input) {
            if (input.files && input.files[0]) {
                var filerdr = new FileReader();
                filerdr.onload = function (e) {
                    $('#stImg').attr('src', e.target.result);
                }
                filerdr.readAsDataURL(input.files[0]);
            }
        }
    </script>

{% endblock %}
