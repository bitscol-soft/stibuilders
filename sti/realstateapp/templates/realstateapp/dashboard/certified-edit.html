{% extends 'realstateapp/dashboard/dash_base.html' %}
{% block title %} {% endblock %}
{% load static %}
{% block content %}
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <div class="container-full">
        <!-- Main content -->
        <section class="content">
            <div class="row">
                <div class="col-md-12">
                    <div class="box">
                        {% if messages %}
						<div class="alert alert-success alert-dismissible fade show" role="alert">
							{% for message in messages %}
							<p {% if message.tags %} class="{{ message.tags }}"{% endif %}> 
							<p class="text-center"><strong>Success!</strong> {{ message }}</p> 
							</p>
							{% endfor %}
						</div>
						{% endif %}
                        <div class="box-body">
                            <div class="row">
                                <div class="col-12">
                                    <h2> Quality Update </h2>
                                </div>

                            </div>

                            <form action="" method="POST" enctype="multipart/form-data"> {% csrf_token %}
                                <div id="base-info">
                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="certified_title"
                                                    class="form-label">
                                                    Certified Title </label>
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    name="certified_title"
                                                    id="certified_title" value="{{get_certified.certified_title}}">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="certified_text"
                                                    class="form-label"> Certified Text
                                                    </label>
                                                    <textarea name="certified_text" id="certified_text" cols="1" rows="4" class="form-control">{{get_certified.certified_text}}</textarea>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-12
                                            col-sm-6 col-md-4
                                            mt-3">
                                            <button
                                                type="submit"
                                                class="btn
                                                btn-primary">
                                                <i
                                                    class="ti-save-alt"></i>
                                                Save
                                            </button>
                                        </div>
                                    </div>

                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- /.content -->
    </div>
</div>

<script src="https://cdn.ckeditor.com/4.6.2/standard-all/ckeditor.js"></script>
<script>
    CKEDITOR.replace( 'editor1', {
        height: 300,

        // Configure your file manager integration. This example uses CKFinder 3 for PHP.
        filebrowserBrowseUrl: '/ckfinder/ckfinder.html',
        filebrowserImageBrowseUrl: '/ckfinder/ckfinder.html?type=Images',
        filebrowserUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Files',
        filebrowserImageUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Images'
    } );
</script>
<script>
    function show(input) {
        if (input.files && input.files[0]) {
            var filerdr = new FileReader();
            filerdr.onload = function (e) {
                $('#stImg').attr('src', e.target.result);
            }
            filerdr.readAsDataURL(input.files[0]);
        }
    }
</script>

{% endblock %}
