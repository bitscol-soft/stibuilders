{% extends 'realstateapp/dashboard/dash_base.html' %}
{% block title %} {% endblock %}
{% load static %}
{% block content %}

<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <div class="container-full">
        <!-- Main content -->
        <section class="content">
            <div class="row">
                <div class="col-12">

                    <div class="box">
                        <div class="box-header with-border">
                            <h3 class="box-title">Company List</h3>
                        </div>
                        <!-- /.box-header -->
                        <div class="box-body">
                            <div class="table-responsive">
                                <table id="data-table" class="table
                                    table-striped
                                    text-center"
                                    style="width:100%">
                                    <thead>
                                        <tr>
                                            <th>Company Name</th>
                                            <th>Company Logo</th>
                                            <th>Phone Number</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for data in getprofile %}
                                        <tr>
                                            <td>{{data.company_name}}</td>
                                               
                                            <td><img
                                                    style="width:120px; height: 20px;"
                                                    src="/static/realstateapp/media/{{data.logo}}"
                                                    alt=""></td>
                                            <td>{{data.mobile}}</td>
                                            
                                            <td>
                                                <a href="/company/{{data.pk}}/profile/update/" class="btn btn-success btn-sm mr-5"> 
                                                    <i class="fa fa-pencil mr-5"></i>
                                                    Edit
                                                </a>
                                                <a href="/company-profile/{{data.pk}}/delete/" class="btn btn-danger btn-sm mr-5"> 
                                                    <i class="fa fa-trash mr-5"></i>
                                                    Delete
                                                </a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>

                                </table>
                            </div>
                        </div>
                        <!-- /.box-body -->
                    </div>
                    <!-- /.box -->
                </div>
            </div>
        </section>
        <!-- /.content -->
    </div>
</div>
<!-- /.content-wrapper -->

{% endblock %}
