{% extends 'realstateapp/dashboard/dash_base.html' %}
{% block title %} {% endblock %}
{% load static %}
{% block content %}
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <div class="container-full">
        <!-- Main content -->
        <section class="content">
            <div class="row">
                <div class="col-md-12">
                    <div class="box">
                        {% if messages %}
						<div class="alert alert-success alert-dismissible fade show" role="alert">
							{% for message in messages %}
							<p {% if message.tags %} class="{{ message.tags }}"{% endif %}> 
							<p class="text-center"><strong>Success!</strong> {{ message }}</p> 
							</p>
							{% endfor %}
						</div>
						{% endif %}
                        <div class="box-body">
                            <div class="row">
                                <div class="col-12">
                                    <h2> Privacy Policy Add </h2>
                                </div>

                            </div>

                            <form action="" method="POST" enctype="multipart/form-data"> {% csrf_token %}
                                <div id="base-info">
                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="title"
                                                    class="form-label">
                                                    Title </label>
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    name="title"
                                                    id="title" value="{{get_pp.title}}">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label
                                                    for="editor1"
                                                    class="form-label"> privacy policy
                                                    </label>
                                                    <textarea cols="10" id="editor1" name="privacy_policy"  rows="10" class="form-control" > {{get_pp.privacy_policy|safe}} </textarea>
                                            
                                            </div>
                                        </div>
                                    </div>
                                 

                                    <div class="row">
                                        <div class="col-xl-12
                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <table class="table table-bordered" style="margin-bottom:0px;">
                                                    <tr>
                                                        <td>
                                                            <label> image </label>
                                                            <input type="file" onchange="show(this)" name="picture"  id="picture">
                                                        </td>
                                                        <td>
                                                            <div class="std_images"> <img src="/static/realstateapp/media/{{get_pp.picture}}" alt="" id="stImg" style="width:50px;height: 50px;"> </div> 
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-12
                                            col-sm-6 col-md-4
                                            mt-3">
                                            <button
                                                type="submit"
                                                class="btn
                                                btn-primary">
                                                <i class="ti-save-alt"></i>
                                                Save
                                            </button>
                                        </div>
                                    </div>

                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- /.content -->
    </div>
</div>


<script>
    function show(input) {
        if (input.files && input.files[0]) {
            var filerdr = new FileReader();
            filerdr.onload = function (e) {
                $('#stImg').attr('src', e.target.result);
            }
            filerdr.readAsDataURL(input.files[0]);
        }
    }
</script>

<script src="https://cdn.ckeditor.com/4.6.2/standard-all/ckeditor.js"></script>
<script>
    CKEDITOR.replace( 'editor1', {
        height: 300,

        // Configure your file manager integration. This example uses CKFinder 3 for PHP.
        filebrowserBrowseUrl: '/ckfinder/ckfinder.html',
        filebrowserImageBrowseUrl: '/ckfinder/ckfinder.html?type=Images',
        filebrowserUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Files',
        filebrowserImageUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Images'
    } );
</script>

{% endblock %}
