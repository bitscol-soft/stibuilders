                                            col-md-4 col-sm-6
                                            col-12">
                                            <div
                                                class="form-group">
                                                <label

                                                    </label>
                                                <input

                                                    id="mobile1"

                                                <label

                                                    <textarea name="address" id="address" cols="1" rows="1" class="form-control">{{getprofile.address}}</textarea>
                                                
                                            </div>
                                        </div>

                                                <input

                                                    name="staring_year" value="{{getprofile.staring_year}}">
                                            </div>
                                        </div>
                                        <div class="col-xl-4
                                            col-md-4 col-sm-6
                                            col-12">

                                                class="form-group">

                                                <input

                                                    class="form-control"
                                                    id="instragram_link"
                                                    name="instragram_link">
                                            </div>
                                        </div>
                                        
                                    </div>

                                            col-md-4 col-sm-6

                                            <div

                                                    name="twitter_link" value="{{getprofile.twitter_link}}">

                                    <div class="row mt-5">
                                        <div class="col-12">
											<label> About </label>
                                            <textarea cols="10" id="editor1" name="about" rows="10" class="form-control">{{getprofile.about}} </textarea>
										</div>
									</div>
                            
                                
                                    <div class="row mt-5">
                                        <div class="col-12">
                                            <label
                                                for="logo"
                                                class="form-label">Company Logo</label>
                                                <table class="table table-bordered" style="margin-bottom:0px;">
                                                    <tr>
                                                        <td>
                                                            <label> Company logo </label>
                                                            <input type="file" onchange="show(this)" name="logo"  id="logo">
                                                        </td>
                                                        <td style="width:200px;">
                                                            <div class="std_images"> <img src="/static/realstateapp/media/{{getprofile.logo}}" alt="" id="stImg" style="width:200px;height: 150px;"> </div>

                                                    </tr>
                                                </table>
                                        </div>
                                    </div>

                                        <div class="col-12
                                            col-sm-6 col-md-4

</div>

<script src="https://cdn.ckeditor.com/4.6.2/standard-all/ckeditor.js"></script>
<script>
    CKEDITOR.replace( 'editor1', {
        height: 300,

        // Configure your file manager integration. This example uses CKFinder 3 for PHP.
        filebrowserBrowseUrl: '/ckfinder/ckfinder.html',
        filebrowserImageBrowseUrl: '/ckfinder/ckfinder.html?type=Images',
        filebrowserUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Files',
        filebrowserImageUploadUrl: '/ckfinder/core/connector/php/connector.php?command=QuickUpload&type=Images'
    } );
</script>

<script>
    function show(input) {
        if (input.files && input.files[0]) {
            var filerdr = new FileReader();
            filerdr.onload = function (e) {
                $('#stImg').attr('src', e.target.result);
            }
            filerdr.readAsDataURL(input.files[0]);
        }
    }
</script>
