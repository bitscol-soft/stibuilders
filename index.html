<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STI Builders Limited — static preview</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="docs/">
<script>
/* Entry point for https://bitscol-soft.github.io/stibuilders/
   GitHub Pages serves this branch from the repository root, and the rendered
   site lives in /docs/. This forwards to that folder so the short URL works,
   and keeps the choice of theme and language the visitor already made. */
(function () {
  var lang = null, theme = null;
  try { lang = localStorage.getItem('sti_lang'); } catch (e) {}
  if (lang !== 'en' && lang !== 'bn') {
    lang = (navigator.language || 'en').toLowerCase().indexOf('bn') === 0 ? 'bn' : 'en';
  }
  try { theme = localStorage.getItem('sti_theme'); } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') theme = 'light';
  location.replace('docs/' + theme + '-' + lang + '.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=docs/light-en.html"></noscript>
</head>
<body style="margin:0;font:16px/1.6 system-ui,sans-serif;background:#0c1f26;color:#e8efee">
  <div style="max-width:34rem;margin:18vh auto;padding:0 1.5rem;text-align:center">
    <h1 style="font-size:1.4rem;margin:0 0 .75rem">STI Builders Limited</h1>
    <p style="color:#9fb0b2;margin:0 0 1.25rem">Taking you to the site…</p>
    <p><a href="docs/" style="color:#e0a35e">Continue to the preview</a></p>
  </div>
</body>
</html>
